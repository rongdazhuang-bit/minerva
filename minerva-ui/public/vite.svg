<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Minerva">
  <title>Minerva</title>
  <!-- 亮青蓝圆角方块背景 -->
  <rect x="10" y="10" width="80" height="80" rx="20" ry="20" fill="#3ABFF8"/>
  <!-- 居中粗体白色 M -->
  <text
    x="50"
    y="50"
    text-anchor="middle"
    dominant-baseline="central"
    fill="#FFFFFF"
    font-family="system-ui, -apple-system, 'Segoe UI', Arial, Helvetica, sans-serif"
    font-size="42"
    font-weight="700"
  >M</text>
</svg>

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "minerva-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "psycopg2-binary>=2.9",
  "alembic>=1.14",
  "pydantic>=2.10",
  "pydantic-settings>=2.6",
  "httpx>=0.28",
  "bcrypt>=4.2",
  "pyjwt>=2.9",
  "python-multipart>=0.0.17",
  "email-validator>=2.2",
  "slowapi>=0.1.9",
  "orjson>=3.10",
  "boto3>=1.35",
  "celery",
  "redis",
  "langgraph>=1.2.0",
  "langchain>=1.3.1",
  "langchain-core>=1.4.0",
  "langchain-openai>=1.2.1",
  "langgraph-checkpoint-postgres>=3.1.0",
  "psycopg[binary]>=3.3.4",
  "python-pptx>=1.0.2",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "xlrd>=2.0",
  "xlwt>=1.3",
  "pymupdf>=1.24",
  "mem0ai[nlp]>=0.1.117",
  "en-core-web-sm>=3.8.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28",
  "pytest>=8",
  "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

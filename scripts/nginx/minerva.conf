# Minerva 生产反向代理示例
#
# 用法：
#   1. 构建前端：cd frontend && npm run build  → frontend/dist
#   2. 启动后端：uvicorn app.main:app --host 127.0.0.1 --port 8000（或 systemd minerva-backend）
#   3. 按需修改下方变量后，include 到 nginx.conf 或 sites-enabled：
#        include /path/to/minerva/scripts/nginx/minerva.conf;
#
# 约定：
#   - 业务 API 统一 /api/*，转发时保留 /api 前缀（与 FastAPI main.py 一致）
#   - /healthz、/docs、/mcp/s/* 直连后端根路径
#   - 前端 VITE_API_BASE_URL 留空（同源 /api），勿在 base URL 中重复写 /api

upstream minerva_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name minerva.example.com;

    # 前端静态资源（npm run build 输出目录）
    root /var/www/minerva/frontend/dist;
    index index.html;

    client_max_body_size 100m;

    # 业务 API（保留 /api 前缀转发）
    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_pass http://minerva_backend/api/;

        # Agent/润色等长连接；须大于后端 AI_HTTP_READ_TIMEOUT（默认 120s）
        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    # 健康检查（负载均衡探活）
    location = /healthz {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_pass http://minerva_backend/healthz;
    }

    # OpenAPI / Swagger（可选，生产可注释或加 IP 白名单）
    location ~ ^/(docs|redoc|openapi\.json)$ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_pass http://minerva_backend;
    }

    # MCP 出站 Streamable HTTP（若启用 mcp_server_enabled）
    location /mcp/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://minerva_backend/mcp/;
        proxy_read_timeout 300s;
    }

    # SPA：除上述路径外均回退 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}


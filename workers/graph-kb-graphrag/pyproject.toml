[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "minerva-graph-kb-graphrag-worker"
version = "0.1.0"
description = "Isolated GraphRAG HTTP worker for Minerva GraphKB"
# graphrag 3.x declares Python <3.14
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.10",
  "httpx>=0.28",
]

[project.optional-dependencies]
# Pinned 2026-08-23; pulls graphrag CLI + search SDK; parquet export reads use pandas/pyarrow.
engine = [
  "graphrag==3.1.2",
  "pandas>=3.0,<4",
  "pyarrow>=25.0,<26",
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
